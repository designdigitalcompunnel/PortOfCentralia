<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="maptitle mapdesc"><title id="maptitle">Centralia regional orientation diagram</title><desc id="mapdesc">Illustrative orientation showing Centralia, Lewis County and the Port office; not a survey or street map.</desc><rect width="1200" height="900" fill="#E9EFF3"/><g fill="none" stroke="#B8CBD6" stroke-width="32"><path d="M-30 230 C260 120 500 350 1230 150"/><path d="M-30 680 C360 490 740 800 1230 620"/><path d="M320 -20 L470 920"/><path d="M950 -20 L750 920"/></g><path d="M-30 680 C360 490 740 800 1230 620" stroke="#fff" stroke-width="5" stroke-dasharray="20 20" fill="none"/><g font-family="Arial,sans-serif" fill="#263845"><text x="75" y="100" font-size="45" font-weight="700">CENTRALIA, WASHINGTON</text><text x="75" y="148" font-size="25">Lewis County · Regional orientation</text><rect x="330" y="340" width="560" height="175" rx="28" fill="#fff" stroke="#455766" stroke-width="4"/><circle cx="410" cy="420" r="27" fill="#FF8B2B"/><text x="465" y="408" font-size="34" font-weight="700">Port of Centralia</text><text x="465" y="455" font-size="27">3508 Galvin Road (office)</text><text x="75" y="820" font-size="24">Illustrative diagram — not to scale; does not show Industrial Park I boundaries.</text></g></svg>